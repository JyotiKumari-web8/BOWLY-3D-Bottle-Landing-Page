<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Bolly Clarify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f7f6f9;
      color: #120f1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: white;
      padding: 3.5rem 2.5rem;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(18, 15, 26, 0.08);
      max-width: 480px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 0.35rem 0.85rem;
      border-radius: 100px;
      background: rgba(92, 53, 182, 0.08);
      color: #5c35b6;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 4rem;
      font-weight: 800;
      color: #5c35b6;
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    h2 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }
    p {
      color: #6b647c;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #120f1a;
      color: white;
      text-decoration: none;
      padding: 0.85rem 2rem;
      border-radius: 100px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background: #5c35b6;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">PAGE NOT FOUND</span>
    <h1>404</h1>
    <h2>Looking for your scalp routine?</h2>
    <p>The page you requested does not exist or has been moved. Redirecting you to the 3D Experience...</p>
    <a href="/" class="btn">Return to Bolly Home</a>
  </div>
  <script>
    setTimeout(function() {
      window.location.href = '/';
    }, 2500);
  </script>
</body>
</html>
